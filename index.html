<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أخدم عند روحك — منصة العمل عن بعد للخدمات الرقمية في الجزائر</title>
<meta name="description" content="منصة جزائرية للعمل عن بعد: خدمات رقمية، عمال أحرار، طلبات، دفع بالبطاقة البنكية CIB والذهبية، محادثات، تقييمات وتسليم ملفات.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --pri:#059669; --pri-2:#10b981; --dark:#0f172a; --ink:#1e293b; --muted:#64748b;
    --bg:#f6f8fa; --card:#ffffff; --line:#e2e8f0; --soft:#ecfdf5;
    --amber:#f59e0b; --red:#ef4444; --blue:#2563eb;
    --grad:linear-gradient(135deg,#059669 0%,#10b981 100%);
    --shadow:0 10px 30px rgba(15,23,42,.08); --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
  button,input,select,textarea{font-family:inherit}
  button{cursor:pointer}
  a{color:inherit;text-decoration:none}
  .hidden{display:none!important}
  .container{max-width:1140px;margin:0 auto;padding:0 18px}
  .grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

  /* Header */
  header{position:sticky;top:0;z-index:80;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .hwrap{display:flex;align-items:center;gap:16px;padding:12px 0}
  .logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.1rem;white-space:nowrap}
  .logo .ic{width:42px;height:42px;border-radius:13px;background:var(--grad);display:grid;place-items:center;font-size:21px;box-shadow:0 8px 18px rgba(5,150,105,.3);color:#fff}
  nav.links{margin-inline-start:auto;display:flex;gap:4px}
  nav.links button{background:none;border:none;border-radius:11px;padding:9px 14px;font-weight:700;font-size:.9rem;color:var(--muted);transition:.2s}
  nav.links button:hover,nav.links button.active{color:var(--pri);background:var(--soft)}
  .h-auth{display:flex;align-items:center;gap:8px}
  .burger{display:none;width:42px;height:42px;border-radius:12px;background:var(--bg);border:1px solid var(--line);flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .burger span{width:18px;height:2px;background:var(--ink);border-radius:2px}
  #mobileNav{display:none;border-top:1px solid var(--line);background:#fff;padding:8px 18px 14px}
  #mobileNav.open{display:block}
  #mobileNav button{display:block;width:100%;text-align:right;background:none;border:none;padding:11px 6px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line);font-size:.95rem}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:13px;padding:12px 22px;font-weight:800;font-size:.92rem;transition:.22s}
  .btn-pri{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(5,150,105,.3)}
  .btn-pri:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(5,150,105,.38)}
  .btn-soft{background:var(--soft);color:var(--pri)}
  .btn-soft:hover{background:#d1fae5}
  .btn-dark{background:var(--dark);color:#fff}
  .btn-out{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
    .btn-out:hover{border-color:var(--pri);color:var(--pri)}
  </body>
  </html>
